name: PR Scripted

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-scripted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scripted:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: Run cross-build scripted tests
        run: |
          ./sbt "+compile"
          ./sbt "++ 2.12.21! scripted skillsjars/*"
          ./sbt "++ 3.8.4! scripted skillsjars-sbt2/*"
